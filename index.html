<head>

<title>Sinuca Snooker 4x4 - ONLINE</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}
body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0d0d0d;font-family:'Segoe UI',sans-serif;overflow:hidden}
#game-container{position:relative;width:100vw;height:100vh;max-width:420px;max-height:780px;background:#1b5e20;border:14px solid #3e2723;border-radius:24px;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,.9)}
canvas{width:100%;height:100%;display:block}
#lobby{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;padding:20px}
#lobby input{padding:12px;font-size:18px;text-align:center;border-radius:8px;border:none;margin:10px;width:180px;text-transform:uppercase}
#lobby button{background:#2196f3;border:none;padding:12px 24px;color:white;font-weight:bold;border-radius:8px;cursor:pointer;margin:8px;font-size:15px;width:200px}
#room-code{font-size:32px;color:#ffeb3b;letter-spacing:4px}
#hud{position:absolute;top:15px;width:100%;display:flex;justify-content:space-around;color:white;font-weight:800;font-size:16px;text-shadow:2px 2px 4px rgba(0,0,0,.8);z-index:20;pointer-events:none}
